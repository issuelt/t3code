name: Fork Release

# Publishes the fork's desktop builds as nightly-channel prereleases on this
# repository, which installed fork builds poll through electron-updater.
# Upstream's release.yml needs Blacksmith runners and org secrets, so it stays
# disabled here.
# Pull requests only build Linux as a packaging canary; main builds every
# platform before it publishes. Linux and Android stages live in
# fork-release-linux.yml, which picks VM104 or Blacksmith for trusted events.
# Windows uses the Blacksmith label from the version stage while this month's
# Blacksmith tally leaves room; macOS stays hosted.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fork-release-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  version:
    uses: issuelt/t3code/.github/workflows/fork-release-linux.yml@main
    # GitHub checks every nested job against each call, and the callee's hosted publish job needs
    # contents: write, and its route job needs actions: read. These are ceilings: the callee's other jobs keep its top-level contents: read.
    permissions:
      contents: write
      actions: read
    with:
      stage: version

  # Linux builds in the callee's build stage, so pull requests skip this job.
  desktop:
    if: github.event_name != 'pull_request'
    needs: version
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    # The version stage writes blacksmith_windows only for trusted events, from a validated variable.
    runs-on: >-
      ${{ matrix.platform == 'win' && github.repository == 'issuelt/t3code' && github.ref == 'refs/heads/main'
        && needs.version.outputs.blacksmith_windows || matrix.runner }}
    # route-blacksmith.sh reserves Windows's 60 minutes; macOS keeps the default.
    timeout-minutes: ${{ matrix.timeout_minutes || 360 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac
            target: dmg
            arch: arm64
            runner: macos-15
            rust_target: aarch64-apple-darwin
            resource_key: darwin-arm64
          - platform: win
            target: nsis
            arch: x64
            runner: windows-2025
            timeout_minutes: 60
            rust_target: x86_64-pc-windows-msvc
            resource_key: win32-x64
    steps:
      - name: Checkout
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach FETCH_HEAD

      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: ${{ matrix.platform != 'win' }}
          run-install: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Install Spectre-mitigated MSVC libs
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) { exit 1 }

      # Squirrel.Mac installs an update only if it satisfies the running app's
      # designated requirement, which pins this certificate. Ad hoc signatures
      # change every build, so they can never update.
      - name: Import fork macOS signing certificate
        if: matrix.platform == 'mac'
        env:
          P12: ${{ secrets.FORK_MAC_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.FORK_MAC_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/fork-signing.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/fork-signing.p12"
          security import "$RUNNER_TEMP/fork-signing.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/fork-signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain .github/fork/mac-signing-cert.pem
          security find-identity -v -p codesigning "$keychain" | grep -F '"T3 Code Fork Signing"'
          echo "CSC_NAME=T3 Code Fork Signing" >> "$GITHUB_ENV"
          # electron-builder skips signing on pull requests unless told otherwise.
          # Only branches of this repository receive the signing secrets.
          echo "CSC_FOR_PULL_REQUEST=true" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: vp install

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.version.outputs.version }}"

      - name: Build desktop artifact
        shell: bash
        run: |
          vp run dist:desktop:artifact \
            --platform "${{ matrix.platform }}" \
            --target "${{ matrix.target }}" \
            --arch "${{ matrix.arch }}" \
            --build-version "${{ needs.version.outputs.version }}" \
            --verbose

      - name: Verify macOS signature pins the fork certificate
        if: matrix.platform == 'mac'
        run: |
          set -euo pipefail
          fingerprint="$(openssl x509 -in .github/fork/mac-signing-cert.pem -noout -fingerprint -sha1 | cut -d= -f2 | tr -d : | tr '[:upper:]' '[:lower:]')"
          unpacked="$RUNNER_TEMP/verify-zip"
          ditto -x -k "$(find release -maxdepth 1 -name '*.zip' | head -n 1)" "$unpacked"
          app="$(find "$unpacked" -maxdepth 1 -name '*.app' -type d | head -n 1)"
          codesign --verify --deep --strict "$app"
          requirement="$(codesign -d -r- "$app" 2>&1)"
          echo "$requirement"
          grep -q "H\"$fingerprint\"" <<<"$requirement"

      # setup-vp selects engines.node from package.json, the version the CLI executable embeds.
      - name: Build CLI single-executable
        shell: bash
        run: node apps/server/scripts/cli.ts build-exe --verbose

      - name: Build CLI archive
        shell: bash
        run: |
          set -euo pipefail
          binary_name="t3-resource-monitor${{ matrix.platform == 'win' && '.exe' || '' }}"
          monitor_dir="$RUNNER_TEMP/cli-resource-monitor"
          mkdir -p "$monitor_dir/${{ matrix.resource_key }}"
          cp "native/resource-monitor/target/${{ matrix.rust_target }}/release/$binary_name" "$monitor_dir/${{ matrix.resource_key }}/$binary_name"
          node scripts/build-cli-archive.ts \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --version "${{ needs.version.outputs.version }}" \
            --resource-monitor-dir "$monitor_dir" \
            --output-dir release-cli

      - name: Smoke-test CLI archive
        shell: bash
        run: node scripts/smoke-cli-archive.ts --archive release-cli/* --expect-version "${{ needs.version.outputs.version }}"

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p release-publish
          for file in release-cli/* release/*.dmg release/*.zip release/*.AppImage release/*.deb release/*.exe release/*.blockmap release/*.yml; do
            [[ "$file" == */builder-debug.yml ]] && continue
            cp "$file" release-publish/
          done
          ls -la release-publish

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-publish/*
          if-no-files-found: error

  linux:
    needs: version
    uses: issuelt/t3code/.github/workflows/fork-release-linux.yml@main
    # GitHub checks every nested job against each call, and the callee's hosted publish job needs
    # contents: write, and its route job needs actions: read. These are ceilings: the callee's other jobs keep its top-level contents: read.
    permissions:
      contents: write
      actions: read
    with:
      stage: build
      version: ${{ needs.version.outputs.version }}
    secrets:
      FORK_ANDROID_KEYSTORE: ${{ secrets.FORK_ANDROID_KEYSTORE }}
      FORK_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.FORK_ANDROID_KEYSTORE_PASSWORD }}
      CI_ROUTER_APP_KEY: ${{ secrets.CI_ROUTER_APP_KEY }}

  publish:
    if: github.event_name != 'pull_request'
    needs: [version, desktop, linux]
    uses: issuelt/t3code/.github/workflows/fork-release-linux.yml@main
    permissions:
      contents: write
      actions: read
    with:
      stage: publish
      version: ${{ needs.version.outputs.version }}
      tag: ${{ needs.version.outputs.tag }}
      name: ${{ needs.version.outputs.name }}
    secrets:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      CI_ROUTER_APP_KEY: ${{ secrets.CI_ROUTER_APP_KEY }}
