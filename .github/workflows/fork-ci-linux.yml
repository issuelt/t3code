name: Fork CI Linux

# Callers use this file at @main so the runner group can allowlist it. The
# runner choice reads the github context, which a pull request cannot edit, and
# the route job below, whose script also comes from main.

on:
  workflow_call:
    secrets:
      CI_ROUTER_APP_KEY:
        required: false

permissions:
  contents: read

jobs:
  # Picks VM104 only when it is idle and nothing waits for it, so a busy or
  # offline VM104 never queues a job. Separately, it picks the Blacksmith label
  # while this month's tally leaves room. An untrusted event, such as a fork
  # pull request, skips every step, so both stay empty and the job runs hosted.
  route:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    outputs:
      vm104: ${{ steps.decide.outputs.vm104 }}
      blacksmith_linux: ${{ steps.blacksmith.outputs.blacksmith_linux }}
    env:
      TRUSTED: >-
        ${{ github.repository == 'issuelt/t3code' && (
            (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
            ((github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.ref == 'refs/heads/main')
        ) }}
    steps:
      # This file runs from main, so the router comes from main too, never from a pull request.
      # A plain fetch: actions/checkout without persisted credentials trips on the .repos/ gitlinks.
      - name: Check out the router from main
        if: env.TRUSTED == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch -q --no-tags --depth=1 origin refs/heads/main
          git sparse-checkout set --no-cone '/.github/scripts/'
          git -c checkout.workers=0 checkout -q --detach FETCH_HEAD
      - name: Decide
        id: decide
        if: env.TRUSTED == 'true'
        continue-on-error: true
        env:
          APP_ID: ${{ vars.CI_ROUTER_APP_ID }}
          APP_KEY: ${{ secrets.CI_ROUTER_APP_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/route-vm104.sh
      - name: Decide Blacksmith
        id: blacksmith
        if: env.TRUSTED == 'true'
        continue-on-error: true
        env:
          BLACKSMITH_ROUTING: ${{ vars.BLACKSMITH_ROUTING }}
          BLACKSMITH_LINUX_LABEL: ${{ vars.BLACKSMITH_LINUX_LABEL }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/route-blacksmith.sh

  check:
    needs: route
    # A failed route job still leaves the check to run, on a hosted runner.
    if: ${{ !cancelled() }}
    name: Fork changed-file checks
    runs-on: >-
      ${{ fromJSON(
        github.repository == 'issuelt/t3code' && (
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
          ((github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.ref == 'refs/heads/main')
        )
        && (
          needs.route.outputs.vm104 == 'true' && '{"group":"conf-ubuntu-t3code","labels":"issuelt-t3code-ubuntu24"}'
          || needs.route.outputs.blacksmith_linux != '' && format('"{0}"', needs.route.outputs.blacksmith_linux)
        )
        || '"ubuntu-24.04"') }}
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      # A merge whose tree equals a pull request head that already passed was tested there.
      - name: Skip a push whose tree already passed its pull request
        id: gate
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          api() {
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/$1"
          }
          tree="$(api "commits/$GITHUB_SHA" | jq -r .commit.tree.sha)" || exit 0
          [[ "$tree" =~ ^[0-9a-f]{40}$ ]] || exit 0
          heads="$(api "commits/$GITHUB_SHA/pulls" | jq -r '.[] | select(.merged_at != null) | .head.sha')" || exit 0
          for head in $heads; do
            head_tree="$(api "commits/$head" | jq -r .commit.tree.sha)" || continue
            [[ "$head_tree" =~ ^[0-9a-f]{40}$ && "$head_tree" == "$tree" ]] || continue
            passed="$(api "actions/workflows/fork-ci.yml/runs?event=pull_request&status=success&head_sha=$head" | jq -r .total_count)" || continue
            if [[ "$passed" =~ ^[1-9] ]]; then
              echo "Tree $tree already passed Fork CI at pull request head $head."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        if: steps.gate.outputs.skip != 'true'
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version-file: package.json
          # VM104's clean image carries a warm pnpm store; GitHub's cache would only add uplink traffic.
          cache: ${{ runner.environment == 'github-hosted' || startsWith(runner.name, 'blacksmith-') }}
          run-install: true
      # VM104 has no sudo, and its image carries the browser libraries. Blacksmith has sudo.
      - name: Install test browsers
        if: steps.gate.outputs.skip != 'true'
        env:
          WITH_DEPS: ${{ (runner.environment == 'github-hosted' || startsWith(runner.name, 'blacksmith-')) && '--with-deps' || '' }}
        run: |
          # shellcheck disable=SC2086
          node apps/web/node_modules/playwright/cli.js install $WITH_DEPS --only-shell chromium
          node apps/server/node_modules/playwright-core/cli.js install --only-shell chromium
      - name: Check changed files
        if: steps.gate.outputs.skip != 'true'
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        # Upstream syncs change hundreds of test files; the default 900s step limit cannot fit them.
        run: vp run check:changed "$BASE_REF" --timeout 2400
