name: Fork CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: fork-ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The callee at @main picks VM104 for same-repo PRs and main pushes, and a hosted runner otherwise.
  check:
    if: github.repository == 'issuelt/t3code'
    uses: issuelt/t3code/.github/workflows/fork-ci-linux.yml@main
    permissions:
      contents: read
      actions: read
    secrets:
      CI_ROUTER_APP_KEY: ${{ secrets.CI_ROUTER_APP_KEY }}
